name: WPContainer

options:
  bundleIdPrefix: com.fabiankaegy
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.3.0"
  mcp-swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.12.1"

settings:
  base:
    # Swift 6 language mode + full strict concurrency checking.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # App Sandbox intentionally OFF (no .entitlements file is attached, so the
    # app is unsandboxed and may shell out to /usr/local/bin/container and manage
    # arbitrary site folders). Signing identity/team are per-config below and are
    # overridden at release time via xcodebuild — never committed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
  configs:
    # Debug is unchanged from day one: ad-hoc identity, no hardened runtime, zero
    # signing friction for local development and `make build`.
    Debug:
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: "NO"
      DEVELOPMENT_TEAM: ""
    # Release turns Hardened Runtime ON (required for Developer ID + notarization).
    # No com.apple.security.cs.* exceptions: spawning `container` via Process and
    # binding a Network.framework listener need none (verified empirically — see
    # docs/RELEASING.md). CODE_SIGN_IDENTITY defaults to ad-hoc "-" so a Release
    # build succeeds with no cert; scripts/release.sh overrides it (and
    # DEVELOPMENT_TEAM) with the real Developer ID Application identity via
    # xcodebuild when one is available.
    Release:
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: "YES"
      DEVELOPMENT_TEAM: ""

targets:
  # Shared core: all models + services. Static library so the CLI binary is
  # self-contained (no runtime framework dependency when installed to /usr/local/bin).
  WPContainerKit:
    type: library.static
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: WPContainerKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_NAME: WPContainerKit
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"

  # SwiftUI application.
  WPContainer:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: WPContainer
    dependencies:
      - target: WPContainerKit
    settings:
      base:
        PRODUCT_NAME: WPContainer
        PRODUCT_BUNDLE_IDENTIFIER: com.fabiankaegy.wpcontainer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_LSMinimumSystemVersion: "27.0"
        INFOPLIST_KEY_CFBundleDisplayName: "WP Container"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Fabian Kaegy. All rights reserved."
        COMBINE_HIDPI_IMAGES: "YES"

  # Scriptable command-line surface for agents: binary `wp-container` (+ `wpc` symlink).
  wp-container:
    type: tool
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: CLI
    dependencies:
      - target: WPContainerKit
      - package: swift-argument-parser
        product: ArgumentParser
      - package: mcp-swift-sdk
        product: MCP
    settings:
      base:
        PRODUCT_NAME: wp-container
        PRODUCT_BUNDLE_IDENTIFIER: com.fabiankaegy.wpcontainer.cli
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  WPContainer:
    build:
      targets:
        WPContainer: all
    run:
      config: Debug
    archive:
      config: Release
  wp-container:
    build:
      targets:
        wp-container: all
    run:
      config: Debug
    archive:
      config: Release
