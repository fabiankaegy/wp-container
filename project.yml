name: WPContainer

options:
  bundleIdPrefix: com.fabiankaegy
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.3.0"
  mcp-swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.12.1"

settings:
  base:
    # Swift 6 language mode + full strict concurrency checking.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # App Sandbox intentionally OFF (no .entitlements file is attached, so the
    # app is unsandboxed and may shell out to /usr/local/bin/container and manage
    # arbitrary site folders). Signing identity/team are per-config below and are
    # overridden at release time via xcodebuild — never committed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
  configs:
    # Debug is unchanged from day one: ad-hoc identity, no hardened runtime, zero
    # signing friction for local development and `make build`.
    Debug:
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: "NO"
      DEVELOPMENT_TEAM: ""
    # Release turns Hardened Runtime ON (required for Developer ID + notarization).
    # No com.apple.security.cs.* exceptions: spawning `container` via Process and
    # binding a Network.framework listener need none (verified empirically — see
    # docs/RELEASING.md). CODE_SIGN_IDENTITY defaults to ad-hoc "-" so a Release
    # build succeeds with no cert; scripts/release.sh overrides it (and
    # DEVELOPMENT_TEAM) with the real Developer ID Application identity via
    # xcodebuild when one is available.
    Release:
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: "YES"
      DEVELOPMENT_TEAM: ""

targets:
  # Shared core: all models + services. Static library so the CLI binary is
  # self-contained (no runtime framework dependency when installed to /usr/local/bin).
  WPContainerKit:
    type: library.static
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WPContainerKit
      - path: Shared
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_NAME: WPContainerKit
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "10"
        SKIP_INSTALL: "YES"

  # SwiftUI application.
  WPContainer:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WPContainer
      # Embed the privileged helper's launchd plist at
      # Contents/Library/LaunchDaemons/ per SMAppService.daemon requirements.
      - path: LaunchDaemons/com.fabiankaegy.wpcontainer.hostshelper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: WPContainerKit
      # Embed the helper executable into Contents/MacOS (code-signed on copy).
      # It is a tool, not a library, so it is copied — never linked.
      - target: wpc-hosts-helper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
      # Embed the wp-container CLI into Contents/MacOS so the app can install it
      # into /usr/local/bin on demand (CLIToolInstaller). Same product shipped in
      # the release CLI zip; copied (a tool, never linked) and code-signed.
      - target: wp-container
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: WPContainer
        PRODUCT_BUNDLE_IDENTIFIER: com.fabiankaegy.wpcontainer
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "10"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_LSMinimumSystemVersion: "26.0"
        INFOPLIST_KEY_CFBundleDisplayName: "WP Container"
        # Without this key macOS Local Network Privacy denies the app EVERY
        # outbound connection to the container vmnet bridge (192.168.64.0/24) —
        # NWConnection reports `unsatisfied (Local network prohibited)` and
        # URLSession fails with NSURLErrorNotConnectedToInternet. That is the
        # proxy's only upstream for a worktree env, so the app served a 502 for
        # every env and every wake timed out (v0.2.0 regression).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "WP Container connects to your local WordPress containers on the container network to serve their sites in your browser."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Fabian Kaegy. All rights reserved."
        COMBINE_HIDPI_IMAGES: "YES"

  # Scriptable command-line surface for agents: binary `wp-container` (+ `wpc` symlink).
  wp-container:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: CLI
    dependencies:
      - target: WPContainerKit
      - package: swift-argument-parser
        product: ArgumentParser
      - package: mcp-swift-sdk
        product: MCP
    settings:
      base:
        PRODUCT_NAME: wp-container
        PRODUCT_BUNDLE_IDENTIFIER: com.fabiankaegy.wpcontainer.cli
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "10"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

  # Tiny privileged daemon (PLAN.md §2f-bis): an XPC listener on a mach service
  # that rewrites the managed /etc/hosts block after re-verifying the caller's
  # authorization and code signature. Registered by the app via
  # SMAppService.daemon and embedded at Contents/MacOS/wpc-hosts-helper.
  # Concurrency is `minimal`: it is a self-contained NSXPC daemon whose objects
  # deliberately are not Sendable, and it links no app code.
  wpc-hosts-helper:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: HostsHelper
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: wpc-hosts-helper
        PRODUCT_BUNDLE_IDENTIFIER: com.fabiankaegy.wpcontainer.hostshelper
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "10"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: HostsHelper/HostsHelper-Bridging.h
        # Embed an Info.plist section in the binary so it carries a bundle id +
        # version (helps SecCode identify the daemon).
        GENERATE_INFOPLIST_FILE: "YES"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "WP Container Hosts Helper"
        SKIP_INSTALL: "YES"

  # Pure-logic unit tests for the shared kit: the proxy's routing table and its
  # static page builders. Links the kit (a static library) directly, so no test
  # host and no app launch — these are all pure functions over a store envelope.
  WPContainerKitTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WPContainerKitTests
    dependencies:
      - target: WPContainerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabiankaegy.wpcontainer.kittests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: "YES"

  # Pure-logic unit tests for the helper's security boundary. Compiles the
  # helper's own validation/rewrite source (and the shared contract) directly so
  # tests exercise the exact code the daemon runs. No test host needed.
  HostsHelperTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: HostsHelperTests
      - path: HostsHelper/HostsBlockRewriter.swift
      - path: Shared/HostsHelperProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabiankaegy.wpcontainer.hostshelpertests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  WPContainer:
    build:
      targets:
        WPContainer: all
    run:
      config: Debug
    archive:
      config: Release
  wp-container:
    build:
      targets:
        wp-container: all
    run:
      config: Debug
    archive:
      config: Release
  wpc-hosts-helper:
    build:
      targets:
        wpc-hosts-helper: all
    run:
      config: Debug
    archive:
      config: Release
  HostsHelperTests:
    build:
      targets:
        HostsHelperTests: all
    test:
      targets:
        - HostsHelperTests
  WPContainerKitTests:
    build:
      targets:
        WPContainerKitTests: all
    test:
      targets:
        - WPContainerKitTests
