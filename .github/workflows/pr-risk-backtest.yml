# Replays pr-risk over a repo's recently merged PRs to tune policy.ts.
# The report shows up in the run summary. Nothing is written to the target repo.
name: PR risk backtest

on:
  workflow_dispatch:
    inputs:
      repository:
        description: owner/repo to replay merged PRs from
        required: true
      count:
        description: How many merged PRs to replay
        default: "100"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/pr-risk
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node backtest.ts "$REPOSITORY" "$COUNT"
        working-directory: .github/pr-risk
        env:
          REPOSITORY: ${{ inputs.repository }}
          COUNT: ${{ inputs.count }}
          # The default token only reads public repos. For private ones, add a
          # fine-grained token with read access as BACKTEST_GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.BACKTEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
